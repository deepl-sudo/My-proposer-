<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Just For You 💗</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#fff0f5,#ffe4ec);min-height:100vh;display:flex;align-items:center;justify-content:center;color:#333}
.card{width:min(92%,430px);background:#fff;border-radius:24px;padding:32px 24px;text-align:center;box-shadow:0 15px 45px #0001}
h1{margin:0 0 12px;font-size:28px}.heart{font-size:55px;animation:pulse 1.5s infinite}@keyframes pulse{50%{transform:scale(1.08)}}
p{color:#666;line-height:1.5}.question{font-size:23px;font-weight:700;margin:24px 0}
input{width:100%;padding:14px;border:1px solid #ddd;border-radius:12px;font-size:16px;margin:8px 0 14px}
button{border:0;border-radius:12px;padding:13px 22px;font-size:16px;font-weight:700;cursor:pointer;margin:5px}
.primary{background:#ff5c8a;color:#fff}.yes{background:#ff5c8a;color:#fff}.no{background:#eee;color:#555;position:relative}
.hidden{display:none}.small{font-size:13px;color:#888}.result{font-size:24px;font-weight:700;color:#ff4f82}
</style>

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;font-family:Arial,sans-serif}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;overflow:hidden;background:linear-gradient(135deg,#ffe6ef,#fff7fb)}
.card{width:min(92vw,560px);min-height:330px;padding:42px 26px;background:rgba(255,255,255,.92);border-radius:28px;text-align:center;box-shadow:0 15px 45px rgba(160,70,100,.18);display:flex;align-items:center;justify-content:center}
h1{color:#6e2b45;font-size:clamp(30px,7vw,48px);margin:12px 0 28px}
.heart{font-size:52px;color:#e85d86;line-height:1}
.buttons{display:flex;gap:16px;justify-content:center}
button{border:0;border-radius:999px;padding:13px 28px;font-size:18px;cursor:pointer;background:#e85d86;color:white}
#noBtn{background:#777}
#tryAgain{height:25px;margin-top:22px;color:#e85d86;font-weight:600}
.hidden{display:none!important}
.poem{white-space:pre-line;color:#5b3443;font-size:19px;line-height:1.75;min-height:180px}
</style>
</head>

<body>
<div class="card">
  <div id="questionPage">
    <div class="heart">♡</div>
    <h1>Will you be mine?</h1>
    <div class="buttons">
      <button id="yesBtn">Yes 💗</button>
      <button id="noBtn">No</button>
    </div>
    <p id="tryAgain"></p>
  </div>

  <div id="poemPage" class="hidden">
    <div class="heart">♥</div>
    <h1>For You 💗</h1>
    <div id="poem" class="poem"></div>
  </div>
</div>

<script>
const noBtn = document.getElementById("noBtn");
const tryAgain = document.getElementById("tryAgain");
const yesBtn = document.getElementById("yesBtn");
const questionPage = document.getElementById("questionPage");
const poemPage = document.getElementById("poemPage");
const poem = document.getElementById("poem");

function moveNo() {
  tryAgain.textContent = "Try Again 💗";
  noBtn.style.position = "fixed";
  noBtn.style.left = Math.max(15, Math.random() * (window.innerWidth - 120)) + "px";
  noBtn.style.top = Math.max(15, Math.random() * (window.innerHeight - 70)) + "px";
}

noBtn.addEventListener("mouseenter", moveNo);
noBtn.addEventListener("touchstart", e => { e.preventDefault(); moveNo(); });
noBtn.addEventListener("click", e => { e.preventDefault(); moveNo(); });

const text = `Kahi lok ayushyat yetat,
aani nakalat special hotat.

Tujhyasobat bolताना ek veglach smile yeto,
aani tu जवळ असलीस ki sagla thoda better vatto.

Mhanun ek choti si wish aahe—
ha sundar bond asaach rahava,
aani pudhcha pratyek moment
tujhyasobat share karta yava. 💗`;

yesBtn.addEventListener("click", () => {
  questionPage.classList.add("hidden");
  poemPage.classList.remove("hidden");
  let i = 0;
  const timer = setInterval(() => {
    poem.textContent += text[i] || "";
    i++;
    if (i >= text.length) clearInterval(timer);
  }, 45);
});
</script>
</body>

</html>
